name: Build Mix Check AI
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --target MixCheckAI_VST3 MixCheckAI_Standalone
      - uses: actions/upload-artifact@v4
        with:
          name: MixCheckAI-${{ matrix.os }}
          path: |
            build/MixCheckAI_artefacts/Release/VST3
            build/MixCheckAI_artefacts/Release/Standalone
